<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div:hover{
            color: red;
        }

        div:hover > p {
            display: block;
            color: white;
            background-color: black;
        }
        div > p {
            display: none;
        }
    </style>
</head>
<body>
    <h1>exemplo de hover</h1>
    <p>passe o mouse</p>
    <div>Passe o mouse aqui
    <p class="01">TEXTO ESCONDIDO</p>
    <p class="01">bosta</p>
    </div>
</body>
</html>
